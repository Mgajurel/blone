services:
  web:
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION:-release}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "3000:3000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      DATA_DIR: /data
      NEXTAUTH_URL: http://localhost:3000

      # --- inference: local Ollama on the host (PRD: local-only, no cloud calls) ---
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_KEEP_ALIVE: 10m
      INFERENCE_TEXT_MODEL: ${INFERENCE_TEXT_MODEL:-qwen3:8b}
      INFERENCE_IMAGE_MODEL: ${INFERENCE_IMAGE_MODEL:-llava}
      INFERENCE_CONTEXT_LENGTH: "8192"
      INFERENCE_JOB_TIMEOUT_SEC: "600"
      INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"

      # --- archival policy (PRD: extracted text yes, pixels no; opt-in via config) ---
      CRAWLER_STORE_SCREENSHOT: "false"
      CRAWLER_FULL_PAGE_SCREENSHOT: "false"
      CRAWLER_FULL_PAGE_ARCHIVE: "false"
      CRAWLER_VIDEO_DOWNLOAD: "false"

  chrome:
    image: zenika/alpine-chrome:123
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars

  meilisearch:
    image: getmeili/meilisearch:v1.13.3
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch:/data.ms

volumes:
  data:
  meilisearch:
